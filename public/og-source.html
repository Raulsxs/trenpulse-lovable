<!doctype html>
<!--
  FONTE do /og.png — cartão de compartilhamento (1200x630).

  Composição determinística de propósito: texto de card de compartilhamento precisa ser pixel-exato,
  e modelo de imagem erra letra. As três peças à direita são geradas DE VERDADE na plataforma
  (as mesmas de "Feito com TrendPulse"), então o card mostra produto real, não mockup.

  Para regerar o PNG: servir esta página, abrir em viewport 1200x630 e capturar.
  Paleta e tipografia idênticas às da landing.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; align-items: center;
    background: #F7F9FB;
    background-image: radial-gradient(115% 85% at 90% 6%, #E7EFF9 0%, #F7F9FB 58%);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    position: relative;
  }
  .barra {
    position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, #0059B3 0%, #0059B3 52%, #1DAFA3 100%);
  }
  .texto { width: 618px; padding: 0 0 0 74px; }
  .marca {
    display: flex; align-items: center; gap: 11px;
    font-size: 19px; font-weight: 700; color: #14253A;
    letter-spacing: -.01em; margin-bottom: 32px;
  }
  .marca .ponto {
    width: 12px; height: 12px; border-radius: 50%;
    background: #0059B3; box-shadow: 0 0 0 4px rgba(0,89,179,.15);
  }
  h1 {
    font-size: 63px; line-height: 1.05; font-weight: 800;
    letter-spacing: -.034em; color: #14253A;
  }
  h1 .azul { color: #0059B3; }
  .risco { width: 84px; height: 5px; background: #1DAFA3; border-radius: 3px; margin: 27px 0 23px; }
  p { font-size: 23px; line-height: 1.45; color: #44546B; max-width: 29ch; }
  .dominio {
    position: absolute; left: 74px; bottom: 52px;
    font-size: 17px; font-weight: 600; color: #79879C;
  }
  .pecas { flex: 1; position: relative; height: 630px; }
  .pecas img {
    position: absolute; width: 262px; height: 262px; object-fit: cover;
    border-radius: 18px; border: 1px solid rgba(20,37,58,.10);
    box-shadow: 0 22px 48px rgba(20,37,58,.16);
  }
  .p1 { top: 74px;  left: 34px;  transform: rotate(-6deg); }
  .p2 { top: 176px; left: 232px; transform: rotate(3deg); z-index: 2; }
  .p3 { top: 330px; left: 58px;  transform: rotate(2deg); }
</style>
</head>
<body>
  <div class="barra"></div>
  <div class="texto">
    <div class="marca"><span class="ponto"></span>TrendPulse</div>
    <h1>Sua marca postando<br><span class="azul">todo dia.</span></h1>
    <div class="risco"></div>
    <p>Você escreve a ideia. A IA entrega o post pronto, com a sua cara.</p>
  </div>
  <div class="pecas">
    <img class="p1" src="/showcase/gerados/exemplo_sinais_coracao.jpg" alt="">
    <img class="p2" src="/showcase/gerados/exemplo_ansiedade.jpg" alt="">
    <img class="p3" src="/showcase/gerados/exemplo_sono.jpg" alt="">
  </div>
  <div class="dominio">trendpulse.com.br</div>
</body>
</html>
